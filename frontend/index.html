<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurukshetra — Multi-Agent Arena</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- Top Header Bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚔️</span>
      <div>
        <h1>KURUKSHETRA</h1>
        <p class="subtitle">Live Autonomous Multi-Agent Arena</p>
      </div>
    </div>

    <div class="topbar-stats">
      <span id="conn-badge" class="pill pill-offline">Connecting...</span>
      <span id="storage-badge" class="pill">Storage: ...</span>
      <span id="turn-counter" class="pill">Turn: 0 / 0</span>
      <span id="token-counter" class="pill">Tokens: 0</span>
      <button id="btn-rewake" class="btn btn-ghost" title="Ask all 4 agents to greet again">
        Re-Wake Agents
      </button>
    </div>
  </header>

  <!-- Main Two-Column Arena -->
  <main class="layout">
    <!-- Left Sidebar: Roster + Launch Controls + Past Debates -->
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-header">
          <h2>Arena Warriors</h2>
          <span class="hint">Check 2–4 to debate</span>
        </div>
        <div id="roster-list" class="roster-list"></div>
      </section>

      <section class="panel">
        <h2>Launch Debate</h2>
        <label class="field-label" for="topic-input">Topic / Challenge</label>
        <textarea
          id="topic-input"
          rows="3"
          placeholder="e.g., Should I upgrade my current laptop or buy a brand new one right now?"
        ></textarea>

        <div class="row-inline">
          <label class="field-label" for="max-turns-input">Max Turns</label>
          <input id="max-turns-input" type="number" min="2" max="30" value="12" />
        </div>

        <button id="btn-start" class="btn btn-primary full-width">
          Start Autonomous Debate
        </button>

        <div class="control-grid">
          <button id="btn-pause" class="btn btn-warn" disabled>Pause</button>
          <button id="btn-resume" class="btn btn-success" disabled>Resume</button>
          <button id="btn-stop" class="btn btn-danger" disabled>Stop</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Past Debates</h2>
          <button id="btn-refresh-history" class="btn btn-ghost btn-sm" title="Refresh saved debates">
            ↻ Refresh
          </button>
        </div>
        <div id="history-list" class="history-list">
          <div class="history-empty">Loading history...</div>
        </div>
      </section>
    </aside>

    <!-- Right Stage: Live Debate Feed + Replay Feed + Clarification Panel + Interject Bar -->
    <section class="stage">
      <div id="topic-banner" class="topic-banner hidden">
        <span id="stage-status" class="status-tag">LIVE</span>
        <span id="active-topic-text" class="topic-text"></span>
        <button id="btn-back-live" class="btn btn-ghost btn-sm hidden">
          ← Back to Live
        </button>
      </div>

      <!-- Live feed (active session) -->
      <div id="feed" class="feed"></div>

      <!-- Replay feed (shown only when inspecting a saved debate) -->
      <div id="replay-feed" class="feed hidden"></div>

      <div id="thinking-bar" class="thinking-bar hidden"></div>

      <!-- Majority-Approved Human Clarification Panel (appears when agents pause to ask you) -->
      <div id="clarification-panel" class="clarification-panel hidden">
        <div class="clarification-head">
          <span class="clarify-badge">🗳️ CLARIFICATION REQUESTED</span>
          <span id="clarification-meta" class="clarify-meta"></span>
        </div>
        <p id="clarification-question" class="clarification-question"></p>
        <form id="clarification-form" class="clarification-form">
          <input
            id="clarification-input"
            type="text"
            placeholder="Type your answer to resume the debate from the next turn..."
            autocomplete="off"
          />
          <button id="btn-clarify-submit" type="submit" class="btn btn-violet">
            Send &amp; Resume
          </button>
          <button id="btn-clarify-skip" type="button" class="btn btn-ghost">
            Skip
          </button>
        </form>
      </div>

      <form id="nudge-form" class="nudge-bar">
        <input
          id="nudge-input"
          type="text"
          placeholder="Drop a live mid-debate twist or directive (Creator Interjection)..."
          autocomplete="off"
          disabled
        />
        <button id="btn-nudge" type="submit" class="btn btn-amber" disabled>
          Interject
        </button>
      </form>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
